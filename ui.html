<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M3 Variable Generator — preview</title>
<style>:root{--bg: var(--figma-color-bg, #ffffff);--bg-secondary: var(--figma-color-bg-secondary, #f5f5f5);--text: var(--figma-color-text, #000000e6);--text-secondary: var(--figma-color-text-secondary, #00000080);--border: var(--figma-color-border, #e5e5e5);--danger: var(--figma-color-text-danger, #f24822);--accent: #0d99ff}*{box-sizing:border-box}html,body{margin:0;padding:0;height:100%}body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;font-size:12px;line-height:1.45;color:var(--text);background:var(--bg)}.app-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border)}.app-header h1{font-size:13px;font-weight:600;margin:0}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);height:calc(100vh - 45px)}.inputs{padding:12px 16px 24px;border-right:1px solid var(--border);overflow-y:auto}.preview{padding:12px 16px 32px;overflow-y:auto;min-width:0}.inputs h2,.preview h2{font-size:12px;font-weight:600;margin:14px 0 8px}.inputs h2:first-child,.preview h2:first-child{margin-top:0}.field{margin-bottom:10px}.field label{display:block;font-weight:600;margin-bottom:3px}.field .hint{color:var(--text-secondary);font-weight:400;font-size:11px;margin:2px 0 0}.row{display:flex;gap:8px;align-items:center}input[type=text],select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 8px;min-width:0}input[type=text]{flex:1}input[type=color]{width:34px;height:28px;padding:0;border:1px solid var(--border);border-radius:6px;background:var(--bg);cursor:pointer}input[type=checkbox]{width:14px;height:14px}input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}button{font:inherit;color:var(--text);background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;padding:5px 10px;cursor:pointer}button:hover{filter:brightness(.97)}.btn-primary{background:var(--accent);color:#fff;border-color:transparent;font-weight:600;margin-top:8px;width:100%;padding:8px 12px}.btn-primary:disabled{opacity:.6;cursor:not-allowed}.err{color:var(--danger);font-size:11px;margin:3px 0 0;min-height:0}.err:empty{display:none}.tone-line{margin:4px 0 0;color:var(--text-secondary)}.note{background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;padding:6px 8px;margin:6px 0 0}.note[hidden]{display:none}.check-row{display:flex;gap:8px;align-items:center;margin:10px 0}.palette{margin-bottom:14px}.palette h3{font-size:12px;margin:0 0 4px;font-weight:600}.palette h3 .key{color:var(--text-secondary);font-weight:400}.strip{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:4px}.strip-label{font-size:11px;color:var(--text-secondary);margin:6px 0 3px}.sw{border:1px solid rgba(0,0,0,.25);border-radius:5px;min-width:40px;height:30px;padding:0 4px;font-size:10px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.sw .your{text-decoration:underline}.swatch-detail{color:var(--text-secondary);margin:6px 0 0}table{border-collapse:collapse;width:100%;margin-bottom:6px}th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--border);vertical-align:middle}th{font-size:11px;color:var(--text-secondary);font-weight:600}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}.cell-swatch{display:inline-block;width:22px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.3);vertical-align:-3px;margin-right:6px}.badge-low{display:inline-block;margin-left:6px;padding:0 6px;border-radius:4px;background:#f24822;color:#fff;font-size:11px;font-weight:600;white-space:nowrap}.changes{margin:4px 0 12px;padding-left:18px}.changes li{margin-bottom:3px}.status{color:var(--danger);margin:0 0 8px}.status:empty{display:none}@media(max-width:640px){.layout{grid-template-columns:minmax(0,1fr);height:auto}.inputs{border-right:none;border-bottom:1px solid var(--borde </head>
<body>
<header class="app-header">
  <h1>M3 Variable Generator — preview</h1>
  <button type="button" id="close">Close</button>
</header>
<main class="layout">
  <section class="inputs" aria-label="Inputs">
    <h2>Inputs</h2>
    <p class="status" id="status" role="alert"></p>

    <div class="field">
      <label for="f-primary">Primary</label>
      <div class="row">
        <input type="text" id="f-primary" value="#6750A4" spellcheck="false" autocomplete="off" placeholder="#6750A4">
        <input type="color" id="f-primary-picker" value="#6750a4" aria-label="Primary color picker">
      </div>
      <p class="tone-line" id="primary-tone">Measured tone: —</p>
      <p class="note" id="primary-note" hidden></p>
      <p class="err" id="f-primary-error"></p>
    </div>

    <div class="field">
      <label for="f-secondary-method">Secondary method</label>
      <select id="f-secondary-method">
        <option value="material">Material default</option>
        <option value="analogous">Analogous (+30)</option>
        <option value="complementary">Complementary (+180)</option>
        <option value="triadic">Triadic (+120)</option>
        <option value="split-complementary">Split complementary (+150)</option>
        <option value="monochromatic">Monochromatic</option>
        <option value="custom">Custom</option>
      </select>
    </div>
    <div class="field">
      <label for="f-secondary-hex">Secondary hex</label>
      <input type="text" id="f-secondary-hex" spellcheck="false" autocomplete="off" placeholder="#000000">
      <p class="note" id="f-secondary-hex-note" hidden></p>
      <p class="err" id="f-secondary-hex-error"></p>
    </div>

    <div class="field">
      <label for="f-tertiary-method">Tertiary method</label>
      <select id="f-tertiary-method">
        <option value="material">Material default</option>
        <option value="analogous">Analogous (+30)</option>
        <option value="complementary">Complementary (+180)</option>
        <option value="triadic">Triadic (+120)</option>
        <option value="split-complementary">Split complementary (+150)</option>
        <option value="monochromatic">Monochromatic</option>
        <option value="custom">Custom</option>
      </select>
    </div>
    <div class="field">
      <label for="f-tertiary-hex">Tertiary hex</label>
      <input type="text" id="f-tertiary-hex" spellcheck="false" autocomplete="off" placeholder="#000000">
      <p class="note" id="f-tertiary-hex-note" hidden></p>
      <p class="err" id="f-tertiary-hex-error"></p>
    </div>

    <div class="field">
      <label for="f-neutral">Neutral</label>
      <input type="text" id="f-neutral" spellcheck="false" autocomplete="off">
      <p class="hint">Auto-derived, editable.</p>
      <p class="err" id="f-neutral-error"></p>
    </div>
    <div class="field">
      <label for="f-neutral-variant">Neutral variant</label>
      <input type="text" id="f-neutral-variant" spellcheck="false" autocomplete="off">
      <p class="hint">Auto-derived, editable.</p>
      <p class="err" id="f-neutral-variant-error"></p>
    </div>
    <div class="field">
      <label for="f-error">Error</label>
      <input type="text" id="f-error" spellcheck="false" autocomplete="off">
      <p class="err" id="f-error-error"></p>
    </div>
    <div class="field">
      <label for="f-warning">Warning</label>
      <input type="text" id="f-warning" spellcheck="false" autocomplete="off">
      <p class="err" id="f-warning-error"></p>
    </div>
    <div class="field">
      <label for="f-success">Success</label>
      <input type="text" id="f-success" spellcheck="false" autocomplete="off">
      <p class="err" id="f-success-error"></p>
    </div>

    <div class="check-row">
      <input type="checkbox" id="f-autofix" checked>
      <label for="f-autofix">Auto-fix text contrast</label>
    </div>
    <button type="button" id="f-reset">Reset to derived values</button>
    <div class="action-buttons" style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px;">
      <button type="button" id="f-create" class="btn-primary">Create variables in Figma</button>
      <button type="button" id="f-update" class="btn-primary" disabled>Update variables in Figma</button>
    </div>

    <div id="update-preview-box" class="field" hidden style="margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px;">
      <h3>Update Preview</h3>
      <p class="hint" id="update-summary" style="font-weight: 600; margin-bottom: 8px;"></p>
      <ul class="changes" id="update-diff-list"></ul>
      <button type="button" id="f-apply" class="btn-primary" disabled style="margin-top: 12px;">Apply changes</button>
    </div>
  </section>

  <section class="preview" aria-label="Preview">
    <h2>Palettes</h2>
    <div id="palettes"></div>
    <p class="swatch-detail" id="swatch-detail">Click a swatch to see its hex.</p>

    <h2>Roles</h2>
    <table id="roles-table">
      <thead>
        <tr><th scope="col">Role</th><th scope="col">Light</th><th scope="col">Dark</th></tr>
      </thead>
      <tbody id="roles-body"></tbody>
    </table>

    <h2>Contrast</h2>
    <table id="contrast-table">
      <thead>
        <tr><th scope="col">Text</th><th scope="col">Background</th><th scope="col">Light</th><th scope="col">Dark</th></tr>
      </thead>
      <tbody id="contrast-body"></tbody>
    </table>

    <h2 id="changes-heading">Text changes</h2>
    <ul class="changes" id="changes"></ul>
  </section>
</main>
